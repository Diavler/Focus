# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Defaults: deny known vulnerabilities, unmaintained and yanked crates.
# Each ignore is an "unmaintained" notice (no known vulnerability) deep in iced's tree with no
# replacement yet. Re-check them whenever iced is upgraded.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste: via wgpu's Metal backend (iced renderer); no safe upgrade" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: via cosmic-text/fontdb (iced text); no safe upgrade" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: via gtk, tray-icon's Linux backend, which Focus never builds (tray-icon is Windows-only here)" },
]

[licenses]
# Compatible with shipping the app as MIT OR Apache-2.0.
allow = [
    "MIT",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8
# Mozilla's root certificate list, which rustls (via ureq) bundles as data. CDLA-Permissive-2.0
# is a permissive data licence; allowed for these crates only.
exceptions = [
    { name = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    { name = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
    # Via `dirs`, which tray-icon uses only on Linux, where Focus doesn't use tray-icon.
    { name = "option-ext", allow = ["MPL-2.0"] },
]
unused-allowed-license = "allow"
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path; that's fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
