[package]
name = "ipc-transport"
description = "Local-socket transport for Focus IPC: per-user endpoints, line framing and a client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ipc-proto.workspace = true
focus-core.workspace = true
interprocess.workspace = true
thiserror.workspace = true
tokio.workspace = true

# Windows: pipe access limited to the current user, and checking who serves a pipe (ADR 0004).
# Same versions interprocess already uses.
[target.'cfg(windows)'.dependencies]
widestring = "1.2.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }
