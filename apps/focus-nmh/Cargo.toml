[package]
name = "focus-nmh"
description = "Native messaging host bridging the browser extension to the daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
focus-install.workspace = true
# Reads (never writes) the saved state, to tell "stopped" from "unreachable".
state-json.workspace = true
ipc-proto.workspace = true
ipc-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `io-std`: the browser talks to the host over stdin/stdout.
tokio = { workspace = true, features = ["io-std"] }

[build-dependencies]
# Embeds the app icon in the Windows exe (see build.rs).
winresource.workspace = true

[dev-dependencies]
focus-core = { workspace = true, features = ["testing"] }
focus-daemon = { path = "../focus-daemon" }
config-toml.workspace = true
tempfile.workspace = true
