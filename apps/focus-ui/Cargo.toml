[package]
name = "focus-ui"
description = "Iced desktop UI for Focus; a client of focus-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
focus-core.workspace = true
focus-install.workspace = true
focus-hotkey.workspace = true
ipc-proto.workspace = true
ipc-transport.workspace = true
# Shows calendar and task times in the computer's local time zone.
chrono.workspace = true
# `tokio` runs the async IPC calls and provides `iced::time::every` for polling.
iced = { workspace = true, features = ["tokio"] }

# Colours the native title bar and border to match the theme (DWM).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
# The tray icon the window hides to when closed (DESIGN.md's choice; Linux will use `ksni`).
tray-icon = "0.26"

[build-dependencies]
# Embeds the app icon in the Windows exe (runs the Windows SDK's resource compiler).
winresource = { version = "0.1.34", default-features = false }
