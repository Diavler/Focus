# Focus settings. Edits to the configuration a session is running wait 24 hours before they take
# effect (cooling-off); other edits apply within a few seconds. See docs/DESIGN.md.
#
# Rule keys: allow, ask, delay, feed_only (hide feeds, allow single posts), block.
# Patterns: "site.com" (whole site and subdomains), "site.com/" (front page only),
# "site.com/path/*" (* matches anything).

# Start Focus when you log in. Turning this off also waits 24 hours, like loosening a config.
start_at_login = true

[lists.social]
block = ["x.com", "instagram.com", "tiktok.com"]

[lists.video]
block = ["twitch.tv", "netflix.com"]

[configs.coding]
mode = "blocklist"
include = ["social", "video"]
feed_only = ["reddit.com", "youtube.com"]
allow = ["reddit.com/r/rust/comments/*", "docs.rs", "github.com"]
apps = ["discord", "steam"]

[configs.writing]
mode = "allowlist"
allow = ["docs.google.com", "dictionary.com"]

# Start sessions from your plan. Set up the calendar's secret iCal address and your Todoist token
# in the Focus window (they're kept in the system keychain, not here), then add rules under
# "Automatic starts" in the window, which writes them here. By hand, they look like this:
# An event whose title contains a keyword runs the config until the event ends; a task due at a
# time with one of the labels runs it for the task's duration (or task_minutes).
#
# [[auto_start]]
# config = "coding"
# strictness = "deep"              # light (default), deep or locked
# calendar_keywords = ["#focus"]
# task_labels = ["deep"]
# task_minutes = 50
